env_id: LunarLander-v3
algo: ppo
seeds: [0, 1, 2]
eval_seed_base: 10000     # eval episode i uses seed eval_seed_base + i (never overlaps training seeds)
eval_episodes: 100
total_timesteps: 1000000
n_envs: 16
ppo:
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  gamma: 0.999
  gae_lambda: 0.98
  ent_coef: 0.01
detector:
  window: 100
  timeout_rate_threshold: 0.3
  custom_share_threshold: 0.5
